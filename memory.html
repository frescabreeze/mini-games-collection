<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메모리 카드 · 미니 게임 모음</title>
<link rel="stylesheet" href="./assets/style.css">
<style>
  .mem-board {
    display: grid;
    grid-template-columns: repeat(4, 80px);
    grid-template-rows: repeat(4, 80px);
    gap: 10px;
  }
  .mem-card {
    position: relative;
    width: 80px;
    height: 80px;
    perspective: 600px;
    cursor: pointer;
  }
  .mem-card .inner {
    position: absolute;
    inset: 0;
    transition: transform 0.4s;
    transform-style: preserve-3d;
  }
  .mem-card.flipped .inner { transform: rotateY(180deg); }
  .mem-card .face {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    backface-visibility: hidden;
  }
  .mem-card .front {
    background: var(--accent);
    color: #1e1e2e;
    font-size: 28px;
    font-weight: 700;
  }
  .mem-card .back {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    transform: rotateY(180deg);
  }
  .mem-card.matched .back {
    background: rgba(166, 227, 161, 0.25);
    border-color: var(--success);
  }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">미니 게임<span class="dot">.</span>모음</div>
  <nav><a href="./index.html">← 게임 목록</a></nav>
</header>
<main class="app-main">
  <h1 class="page-title">메모리 카드</h1>
  <p class="page-subtitle">카드를 뒤집어 같은 그림의 쌍을 찾아보세요. 최소 이동으로 완료하는 게 목표입니다.</p>

  <div class="panel">
    <div class="game-layout">
      <div class="game-toolbar">
        <button class="btn primary" id="reset">새 게임</button>
      </div>
      <div class="game-status">
        <span>이동: <strong id="moves">0</strong></span>
        <span>시간: <strong id="time">00:00</strong></span>
        <span>맞춤: <strong id="matched">0</strong> / 8</span>
      </div>
      <div class="mem-board" id="board"></div>
      <div class="game-message" id="msg"></div>
    </div>
  </div>
</main>
<footer class="app-footer">© Mini Games Collection</footer>

<script>
const EMOJIS = ['🍎','🍌','🍇','🍉','🍓','🥝','🍑','🍒'];
const boardEl = document.getElementById('board');
const movesEl = document.getElementById('moves');
const timeEl = document.getElementById('time');
const matchedEl = document.getElementById('matched');
const msgEl = document.getElementById('msg');
const resetBtn = document.getElementById('reset');

let cards, flipped, matched, moves, startTime, timerId, locked;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function init() {
  cards = shuffle([...EMOJIS, ...EMOJIS]);
  flipped = [];
  matched = 0;
  moves = 0;
  locked = false;
  movesEl.textContent = 0;
  matchedEl.textContent = 0;
  timeEl.textContent = '00:00';
  msgEl.textContent = '';
  msgEl.className = 'game-message';
  startTime = null;
  clearInterval(timerId);
  timerId = null;
  render();
}

function startTimer() {
  if (timerId) return;
  startTime = Date.now();
  timerId = setInterval(() => {
    timeEl.textContent = formatTime(Date.now() - startTime);
  }, 500);
}

function render() {
  boardEl.innerHTML = '';
  cards.forEach((e, i) => {
    const card = document.createElement('div');
    card.className = 'mem-card';
    card.dataset.i = i;
    card.innerHTML = `
      <div class="inner">
        <div class="face front">?</div>
        <div class="face back">${e}</div>
      </div>`;
    card.addEventListener('click', () => flip(i, card));
    boardEl.appendChild(card);
  });
}

function flip(i, el) {
  if (locked) return;
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (!startTime) startTimer();
  el.classList.add('flipped');
  flipped.push({i, el});
  if (flipped.length === 2) {
    moves++;
    movesEl.textContent = moves;
    const [a, b] = flipped;
    if (cards[a.i] === cards[b.i]) {
      a.el.classList.add('matched');
      b.el.classList.add('matched');
      matched++;
      matchedEl.textContent = matched;
      flipped = [];
      if (matched === EMOJIS.length) finish();
    } else {
      locked = true;
      setTimeout(() => {
        a.el.classList.remove('flipped');
        b.el.classList.remove('flipped');
        flipped = [];
        locked = false;
      }, 800);
    }
  }
}

function finish() {
  clearInterval(timerId);
  const elapsed = formatTime(Date.now() - startTime);
  msgEl.textContent = `🎉 완료! ${moves}번 이동, ${elapsed} 소요`;
  msgEl.className = 'game-message';
}

resetBtn.addEventListener('click', init);
init();
</script>
</body>
</html>
