<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 · 미니 게임 모음</title>
<link rel="stylesheet" href="./assets/style.css">
<style>
  .grid-2048 {
    position: relative;
    width: 360px;
    height: 360px;
    background: var(--border);
    border-radius: var(--radius);
    padding: 10px;
  }
  .grid-2048 .bg {
    position: absolute;
    inset: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 8px;
  }
  .grid-2048 .bg div {
    background: var(--bg-soft);
    border-radius: 8px;
  }
  .grid-2048 .tiles {
    position: absolute;
    inset: 10px;
  }
  .tile {
    position: absolute;
    width: calc((100% - 24px) / 4);
    height: calc((100% - 24px) / 4);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 30px;
    color: #1e1e2e;
    transition: transform 0.12s ease;
  }
  .tile[data-v="2"] { background: #eee4da; }
  .tile[data-v="4"] { background: #ede0c8; }
  .tile[data-v="8"] { background: #f2b179; color: #fff; }
  .tile[data-v="16"] { background: #f59563; color: #fff; }
  .tile[data-v="32"] { background: #f67c5f; color: #fff; }
  .tile[data-v="64"] { background: #f65e3b; color: #fff; }
  .tile[data-v="128"] { background: #edcf72; color: #fff; font-size: 26px; }
  .tile[data-v="256"] { background: #edcc61; color: #fff; font-size: 26px; }
  .tile[data-v="512"] { background: #edc850; color: #fff; font-size: 26px; }
  .tile[data-v="1024"] { background: #edc53f; color: #fff; font-size: 22px; }
  .tile[data-v="2048"] { background: #edc22e; color: #fff; font-size: 22px; }
  .tile[data-v="4096"], .tile[data-v="8192"] { background: #3c3a32; color: #fff; font-size: 22px; }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">미니 게임<span class="dot">.</span>모음</div>
  <nav><a href="./index.html">← 게임 목록</a></nav>
</header>
<main class="app-main">
  <h1 class="page-title">2048</h1>
  <p class="page-subtitle">
    방향키(<span class="kbd">↑</span><span class="kbd">↓</span><span class="kbd">←</span><span class="kbd">→</span>)로 타일을 움직이고 같은 숫자를 합쳐 2048을 만들어 보세요.
  </p>

  <div class="panel">
    <div class="game-layout">
      <div class="game-toolbar">
        <button class="btn primary" id="reset">새 게임</button>
      </div>
      <div class="game-status">
        <span>점수: <strong id="score">0</strong></span>
        <span>최고점: <strong id="best">0</strong></span>
      </div>
      <div class="grid-2048">
        <div class="bg">
          <div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div>
        </div>
        <div class="tiles" id="tiles"></div>
      </div>
      <div class="game-message" id="msg"></div>
    </div>
  </div>
</main>
<footer class="app-footer">© Mini Games Collection</footer>

<script>
const N = 4;
const tilesEl = document.getElementById('tiles');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');
const resetBtn = document.getElementById('reset');

let grid, score, best, over;

function init() {
  grid = Array.from({length: N}, () => Array(N).fill(0));
  score = 0;
  over = false;
  best = +(localStorage.getItem('g2048_best') || 0);
  bestEl.textContent = best;
  addRandom();
  addRandom();
  msgEl.textContent = '';
  msgEl.className = 'game-message';
  render();
}

function addRandom() {
  const empty = [];
  for (let r=0; r<N; r++) for (let c=0; c<N; c++) if (!grid[r][c]) empty.push([r,c]);
  if (!empty.length) return false;
  const [r,c] = empty[Math.floor(Math.random()*empty.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  return true;
}

function render() {
  tilesEl.innerHTML = '';
  for (let r=0; r<N; r++) {
    for (let c=0; c<N; c++) {
      const v = grid[r][c];
      if (!v) continue;
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.v = v;
      tile.textContent = v;
      const pct = 100/N;
      tile.style.left = `calc(${c*pct}% + ${c*8/N}px)`;
      tile.style.top = `calc(${r*pct}% + ${r*8/N}px)`;
      tilesEl.appendChild(tile);
    }
  }
  scoreEl.textContent = score;
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    localStorage.setItem('g2048_best', best);
  }
}

function slide(row) {
  const filtered = row.filter(v => v);
  for (let i=0; i<filtered.length-1; i++) {
    if (filtered[i] === filtered[i+1]) {
      filtered[i] *= 2;
      score += filtered[i];
      filtered[i+1] = 0;
    }
  }
  const merged = filtered.filter(v => v);
  while (merged.length < N) merged.push(0);
  return merged;
}

function move(dir) {
  if (over) return;
  const before = JSON.stringify(grid);
  if (dir === 'left') {
    grid = grid.map(slide);
  } else if (dir === 'right') {
    grid = grid.map(r => slide(r.slice().reverse()).reverse());
  } else if (dir === 'up') {
    for (let c=0; c<N; c++) {
      const col = grid.map(r => r[c]);
      const res = slide(col);
      for (let r=0; r<N; r++) grid[r][c] = res[r];
    }
  } else if (dir === 'down') {
    for (let c=0; c<N; c++) {
      const col = grid.map(r => r[c]).reverse();
      const res = slide(col).reverse();
      for (let r=0; r<N; r++) grid[r][c] = res[r];
    }
  }
  if (JSON.stringify(grid) !== before) {
    addRandom();
    render();
    if (!canMove()) {
      over = true;
      msgEl.textContent = '게임 오버! 새 게임을 눌러 다시 시작하세요.';
      msgEl.className = 'game-message danger';
    } else if (grid.some(r => r.includes(2048)) && !msgEl.textContent) {
      msgEl.textContent = '🎉 2048 달성! 계속 진행할 수 있습니다.';
      msgEl.className = 'game-message';
    }
  }
}

function canMove() {
  for (let r=0; r<N; r++)
    for (let c=0; c<N; c++) {
      if (!grid[r][c]) return true;
      if (c<N-1 && grid[r][c] === grid[r][c+1]) return true;
      if (r<N-1 && grid[r][c] === grid[r+1][c]) return true;
    }
  return false;
}

document.addEventListener('keydown', e => {
  const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

resetBtn.addEventListener('click', init);
init();
</script>
</body>
</html>
